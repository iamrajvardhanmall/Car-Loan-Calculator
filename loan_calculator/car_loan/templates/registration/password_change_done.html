{% extends "car_loan/base.html" %}
{% load static %}

{% block title %}Password Changed - AI Car Loan Calculator{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4 text-center">
                    <div class="mb-4">
                        <i class="bi bi-check-circle text-success icon-large"></i>
                    </div>
                    
                    <h2 class="mb-3">Password Changed Successfully</h2>
                    <p class="text-muted mb-4">
                        Your password has been changed. You can now use your new password to log in.
                    </p>
                    
                    <div class="d-grid">
                        <a href="{% url 'car_loan:calculator' %}" class="btn btn-primary">
                            <i class="bi bi-calculator me-2"></i>Back to Calculator
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
