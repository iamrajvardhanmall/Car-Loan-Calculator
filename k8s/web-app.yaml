apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app-deployment
  labels:
    app: web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: web-app
        image: carloancalculator-web_app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: DEBUG
          value: "True"
        - name: SECRET_KEY
          value: "k8s-insecure-django-secret-key-12345"
        - name: DB_NAME
          value: "Car_Loan"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "postgres123"
        - name: DB_HOST
          value: "postgres-service"
        - name: DB_PORT
          value: "5432"
        - name: VALUATION_SERVICE_URL
          value: "http://valuation-service:5001/api/estimate"
        - name: PDF_SERVICE_URL
          value: "http://pdf-service:5002/api/generate-pdf"
        - name: GOOGLE_GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: carloan-secrets
              key: GOOGLE_GEMINI_API_KEY
              optional: true
        - name: SOCIAL_AUTH_GOOGLE_OAUTH2_KEY
          valueFrom:
            secretKeyRef:
              name: carloan-secrets
              key: SOCIAL_AUTH_GOOGLE_OAUTH2_KEY
              optional: true
        - name: SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET
          valueFrom:
            secretKeyRef:
              name: carloan-secrets
              key: SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET
              optional: true
        resources:
          requests:
            cpu: "150m"
            memory: "256Mi"
          limits:
            cpu: "600m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /login/
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web-app-service
spec:
  type: NodePort
  selector:
    app: web-app
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-app-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-app-deployment
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
